name: Java 21 Maven CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/ci.sh

      - name: Build and verify on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: .\scripts\ci.bat

      - name: Upload build and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hello-${{ matrix.os }}
          path: |
            target/hello.jar
            target/surefire-reports/
          if-no-files-found: warn
